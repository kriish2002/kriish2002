<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#050609"/><stop offset=".48" stop-color="#11131A"/><stop offset="1" stop-color="#050609"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#BFF7FF"/><stop offset=".45" stop-color="#45DFFF"/><stop offset="1" stop-color="#007DFF"/></linearGradient>
  <linearGradient id="red" x1="0" x2="1"><stop stop-color="#FFB1B1"/><stop offset=".45" stop-color="#FF3E4D"/><stop offset="1" stop-color="#8A0018"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#8B8F98"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <filter id="glowBlue"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="glowRed"><feGaussianBlur stdDeviation="10"/></filter>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
    <line x1="0" y1="0" x2="0" y2="12" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="3"/>
  </pattern>
  <clipPath id="leftFace"><path d="M0 0H605L548 72L582 122L526 171L558 224L505 276L536 330L474 386L500 460H0Z"/></clipPath>
  <clipPath id="rightFace"><path d="M1200 0H596L650 65L616 118L674 169L640 222L694 276L660 330L722 388L700 460H1200Z"/></clipPath>
</defs>

<!-- cinematic manga canvas -->
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="460" fill="url(#hatch)"/>

<!-- monochrome manga panels -->
<g fill="none" stroke="#D7D9DE" stroke-opacity=".18" stroke-width="3">
  <path d="M24 24H270V150H24Z"/><path d="M24 170H270V436H24Z"/>
  <path d="M930 24H1176V150H930Z"/><path d="M930 170H1176V436H930Z"/>
</g>
<g stroke="#FFF" stroke-opacity=".10" stroke-width="2">
  <path d="M34 134L260 38M34 110L230 28M34 194L254 420M52 176L268 392"/>
  <path d="M946 40L1165 136M966 28L1170 116M946 420L1166 196M932 394L1150 180"/>
</g>

<!-- left cool-toned face -->
<g clip-path="url(#leftFace)">
  <path d="M40 460Q35 180 150 78Q260 -20 520 52Q570 105 525 190Q490 250 520 320Q480 410 500 460Z" fill="#D9DCE4"/>
  <path d="M75 90Q180 15 365 40Q470 53 535 120L520 180Q390 108 245 122Q145 135 60 195Z" fill="#A8ADB8"/>
  <path d="M95 150Q210 108 340 136Q430 155 510 205L475 252Q330 205 150 238Z" fill="#F1F2F5"/>
  <!-- hair -->
  <g fill="#151820" stroke="#050609" stroke-width="8">
    <path d="M70 150L118 35L175 108L190 16L242 106L285 8L313 111L380 28L371 130L452 61L422 154L520 105L468 190L535 182L468 232L500 290L425 258L438 334L365 280L330 360L292 288L222 346L226 270L150 305L181 230L88 250L145 188Z"/>
  </g>
  <!-- eye -->
  <path d="M105 248Q245 175 392 245Q255 326 105 248Z" fill="#0A0C11" stroke="#EEF8FF" stroke-width="8"/>
  <ellipse cx="250" cy="250" rx="72" ry="72" fill="url(#blue)" opacity=".28" filter="url(#glowBlue)"/>
  <ellipse cx="250" cy="250" rx="48" ry="56" fill="url(#blue)" stroke="#DDFBFF" stroke-width="5"/>
  <ellipse cx="250" cy="250" rx="17" ry="28" fill="#07101A"/>
  <circle cx="268" cy="228" r="11" fill="#FFFFFF"/>
  <circle cx="228" cy="270" r="5" fill="#FFFFFF" opacity=".75"/>
  <!-- lower face -->
  <path d="M150 326Q260 366 390 320L360 410Q245 448 145 388Z" fill="#C2C5CE"/>
  <path d="M176 372Q255 399 338 369" fill="none" stroke="#6B6F78" stroke-width="5"/>
</g>

<!-- right warm-toned face -->
<g clip-path="url(#rightFace)">
  <path d="M1160 460Q1165 180 1050 78Q940 -20 680 52Q630 105 675 190Q710 250 680 320Q720 410 700 460Z" fill="#7D5B55"/>
  <path d="M1125 90Q1020 15 835 40Q730 53 665 120L680 180Q810 108 955 122Q1055 135 1140 195Z" fill="#34262A"/>
  <path d="M1105 150Q990 108 860 136Q770 155 690 205L725 252Q870 205 1050 238Z" fill="#9B7168"/>
  <!-- hair -->
  <g fill="#191116" stroke="#07080B" stroke-width="8">
    <path d="M1130 150L1082 35L1025 108L1010 16L958 106L915 8L887 111L820 28L829 130L748 61L778 154L680 105L732 190L665 182L732 232L700 290L775 258L762 334L835 280L870 360L908 288L978 346L974 270L1050 305L1019 230L1112 250L1055 188Z"/>
  </g>
  <!-- eye -->
  <path d="M1095 248Q955 175 808 245Q945 326 1095 248Z" fill="#07080B" stroke="#FFE7E7" stroke-width="8"/>
  <ellipse cx="950" cy="250" rx="72" ry="72" fill="url(#red)" opacity=".30" filter="url(#glowRed)"/>
  <ellipse cx="950" cy="250" rx="48" ry="56" fill="url(#red)" stroke="#FFD2D2" stroke-width="5"/>
  <ellipse cx="950" cy="250" rx="17" ry="28" fill="#12060A"/>
  <circle cx="968" cy="228" r="11" fill="#FFFFFF"/>
  <!-- markings -->
  <path d="M842 300L790 335M855 322L812 366M1058 300L1110 335M1045 322L1088 366" stroke="#2A0D12" stroke-width="10"/>
  <path d="M815 370Q940 414 1055 370" fill="none" stroke="#2A0D12" stroke-width="12"/>
</g>

<!-- torn paper seam -->
<path d="M592 0L618 42L590 86L625 128L596 170L632 213L601 258L635 302L603 348L638 392L612 460H548L570 410L536 366L566 321L531 277L562 232L529 188L558 143L526 96L558 48L540 0Z" fill="#F1F0EC"/>
<path d="M606 0L618 42L590 86L625 128L596 170L632 213L601 258L635 302L603 348L638 392L612 460" fill="none" stroke="#8D8D8D" stroke-width="4"/>
<path d="M582 0L596 44L570 87L603 128L574 170L610 213L579 258L613 302L581 348L616 392L590 460" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="2"/>

<!-- central identity plate -->
<g transform="translate(600 350)">
  <rect x="-220" y="-54" width="440" height="108" rx="16" fill="#07090D" fill-opacity=".93" stroke="#E7E8EB" stroke-width="2"/>
  <text x="0" y="-12" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="30" font-weight="900" letter-spacing="3">KRISHNA RAWAT</text>
  <text x="0" y="20" text-anchor="middle" fill="#B7EFFF" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">DEVOPS • CLOUD • AUTOMATION</text>
  <text x="0" y="43" text-anchor="middle" fill="#B9BBC2" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">AZURE  /  TERRAFORM  /  KUBERNETES  /  CI-CD</text>
</g>

<!-- manga sound effects / texture -->
<g fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="900">
  <text x="44" y="78" font-size="18" opacity=".72">SYSTEM // ONLINE</text>
  <text x="980" y="78" font-size="18" opacity=".72">DEPLOY // REPEAT</text>
</g>
<g fill="#FFFFFF" opacity=".55">
  <circle cx="286" cy="54" r="3"/><circle cx="325" cy="74" r="2"/><circle cx="890" cy="56" r="3"/><circle cx="855" cy="82" r="2"/>
</g>

<rect x="2" y="2" width="1196" height="456" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="2"/>
</svg>